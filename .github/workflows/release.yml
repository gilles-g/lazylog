name: Release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  build:
    name: Build ${{ matrix.target }}
    runs-on: ${{ matrix.os }}
    strategy:
      matrix:
        include:
          # Linux builds run on 22.04 (glibc 2.35), not ubuntu-latest (24.04 /
          # glibc 2.39): the binary must load on Debian 12, which ships 2.36.
          - target: x86_64-unknown-linux-gnu
            os: ubuntu-22.04
          - target: aarch64-unknown-linux-gnu
            os: ubuntu-22.04
          - target: x86_64-apple-darwin
            os: macos-latest
          - target: aarch64-apple-darwin
            os: macos-latest
    steps:
      - uses: actions/checkout@v4

      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}

      - name: Install cross-compilation tools
        if: matrix.target == 'aarch64-unknown-linux-gnu'
        run: |
          sudo apt-get update
          sudo apt-get install -y gcc-aarch64-linux-gnu

      - name: Build
        run: cargo build --release --target ${{ matrix.target }}
        env:
          CARGO_TARGET_AARCH64_UNKNOWN_LINUX_GNU_LINKER: aarch64-linux-gnu-gcc

      - name: Check glibc requirement
        if: contains(matrix.target, 'linux')
        env:
          MAX_GLIBC: "2.35"
        run: |
          bin=target/${{ matrix.target }}/release/lazylog
          required=$(grep -aoh 'GLIBC_[0-9]\+\.[0-9]\+' "$bin" | sed 's/GLIBC_//' | sort -uV | tail -1)
          echo "highest glibc symbol required: ${required:-none}"
          if [ -n "$required" ] && [ "$(printf '%s\n%s\n' "$MAX_GLIBC" "$required" | sort -V | tail -1)" != "$MAX_GLIBC" ]; then
            echo "::error::binary requires glibc $required (> $MAX_GLIBC): it would not run on Debian 12"
            exit 1
          fi

      - name: Package
        run: |
          cd target/${{ matrix.target }}/release
          tar czf ../../../lazylog-${{ matrix.target }}.tar.gz lazylog

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: lazylog-${{ matrix.target }}
          path: lazylog-${{ matrix.target }}.tar.gz

  release:
    name: Release
    needs: build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/download-artifact@v4
        with:
          merge-multiple: true

      - name: Create release
        uses: softprops/action-gh-release@v2
        with:
          generate_release_notes: true
          files: lazylog-*.tar.gz
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
